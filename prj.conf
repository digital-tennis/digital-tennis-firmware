CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Digital Tennis Racket"
CONFIG_BT_SMP=y
CONFIG_BT_MAX_CONN=1
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_GPIO=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y

CONFIG_BT_BONDABLE=y
# Screenless racket: SC encryption + bonding, without PIN/MITM authentication.
# Explicitly approved for the NU54 Tennis test device on 2026-10-18.
CONFIG_BT_SMP_SC_PAIR_ONLY=y
